# Builds and starts the same docker-compose stack RepoRun deploys, so the full
# build/runtime log is visible in the GitHub "Actions" tab.
name: Docker build (RepoRun check)

on:
  push:
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: docker compose build
        run: docker compose build --progress=plain

      - name: docker compose up
        run: docker compose up -d

      - name: Wait for web and API (through the /api proxy)
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(console.log).catch(()=>process.exit(1))"; then
              docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/').then(r=>{console.log('GET / ->',r.status);process.exit(r.ok?0:1)})"
              exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy"; exit 1

      - name: Container logs
        if: always()
        run: docker compose ps -a && docker compose logs --no-color
