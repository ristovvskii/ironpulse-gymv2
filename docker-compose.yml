services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # SQLite lives on the persistent volume below (RepoRun keeps .stack-data/ across deploys).
      DATABASE_URL: file:/data/ironpulse.db
      # Required — set in RepoRun "Environment values" (random, at least 32 characters).
      JWT_SECRET: ${JWT_SECRET}
      # Required — the public endpoint URL shown on the RepoRun stack page, e.g. https://ironpulse.example.edu
      CORS_ORIGINS: ${APP_URL}
      WEB_URL: ${APP_URL}
      WEB_APP_URL: ${APP_URL}
      AUTO_SEED_DEMO_USERS: ${AUTO_SEED_DEMO_USERS:-true}
      EMAIL_VERIFICATION_REQUIRED: "false"
      DEV_MAIL_DIR: /data/mails
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ironpulse.local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./.stack-data/db:/data
    cpus: 0.5
    mem_limit: 768m
